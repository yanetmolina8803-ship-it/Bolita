
name: Crear APK de Bolita

on:
  workflow_dispatch:
  push:
    branches: [principal, main, master]

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK con icono personalizado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar y descomprimir ZIP
        run: |
          ZIP=$(find . -maxdepth 5 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP."
            exit 1
          fi
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Localizar proyecto
        run: |
          ARCHIVO=$(find proyecto -type f -name package.json | head -n 1)
          if [ -z "$ARCHIVO" ]; then
            echo "ERROR: Falta package.json."
            exit 1
          fi

          CARPETA=$(dirname "$ARCHIVO")
          echo "PROYECTO=$CARPETA" >> "$GITHUB_ENV"

          test -f "$CARPETA/capacitor.config.json"
          test -f "$CARPETA/www/index.html"
          test -f "$CARPETA/assets/icon.png"

      - name: Instalar dependencias
        working-directory: ${{ env.PROYECTO }}
        run: npm install

      - name: Crear proyecto Android
        working-directory: ${{ env.PROYECTO }}
        run: npx cap add android

      - name: Sincronizar aplicación
        working-directory: ${{ env.PROYECTO }}
        run: npx cap sync android

      - name: Aplicar icono y fondo sin duplicar recursos
        working-directory: ${{ env.PROYECTO }}
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          res = Path("android/app/src/main/res")
          origen = Path("assets/icon.png")

          if not origen.exists():
              raise SystemExit("ERROR: Falta assets/icon.png")

          imagen = Image.open(origen).convert("RGBA")

          # Iconos para distintas densidades.
          for densidad, tamano in [
              ("mdpi", 48),
              ("hdpi", 72),
              ("xhdpi", 96),
              ("xxhdpi", 144),
              ("xxxhdpi", 192)
          ]:
              carpeta = res / f"mipmap-{densidad}"
              carpeta.mkdir(parents=True, exist_ok=True)
              icono = imagen.resize(
                  (tamano, tamano), Image.Resampling.LANCZOS
              )
              icono.save(carpeta / "ic_launcher.png")
              icono.save(carpeta / "ic_launcher_round.png")

          # Icono frontal transparente para Android adaptativo.
          carpeta_dibujos = res / "drawable"
          carpeta_dibujos.mkdir(parents=True, exist_ok=True)

          frontal = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          figura = imagen.resize((360, 360), Image.Resampling.LANCZOS)
          frontal.alpha_composite(figura, (36, 36))
          frontal.save(carpeta_dibujos / "ic_launcher_foreground.png")

          # Actualizar el color existente, sin crear colors.xml duplicado.
          valores = res / "values"
          valores.mkdir(parents=True, exist_ok=True)

          archivo_color = None
          arbol_color = None
          nodo_color = None

          for archivo in valores.glob("*.xml"):
              try:
                  arbol = ET.parse(archivo)
                  nodo = arbol.getroot().find(
                      "./color[@name='ic_launcher_background']"
                  )
                  if nodo is not None:
                      archivo_color = archivo
                      arbol_color = arbol
                      nodo_color = nodo
                      break
              except ET.ParseError:
                  continue

          if nodo_color is None:
              archivo_color = valores / "ic_launcher_background.xml"
              raiz = ET.Element("resources")
              nodo_color = ET.SubElement(
                  raiz, "color",
                  {"name": "ic_launcher_background"}
              )
              arbol_color = ET.ElementTree(raiz)

          nodo_color.text = "#B90018"
          arbol_color.write(
              archivo_color,
              encoding="utf-8",
              xml_declaration=True
          )

          # Configurar los iconos adaptativos.
          adaptativos = res / "mipmap-anydpi-v26"
          adaptativos.mkdir(parents=True, exist_ok=True)

          contenido = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''

          for nombre in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              (adaptativos / nombre).write_text(
                  contenido, encoding="utf-8"
              )

          print("Icono personalizado y fondo rojo configurados.")
          print("Color actualizado en:", archivo_color)
          PY

      - name: Construir APK
        working-directory: ${{ env.PROYECTO }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bolita-APK-icono-corregido
          path: ${{ env.PROYECTO }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
