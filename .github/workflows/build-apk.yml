
name: Crear APK de Bolita

on:
  workflow_dispatch:
  push:
    branches: [principal, main, master]

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK con icono correcto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar y descomprimir ZIP
        run: |
          ZIP=$(find . -maxdepth 5 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP."
            exit 1
          fi
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Localizar proyecto
        run: |
          ARCHIVO=$(find proyecto -type f -name package.json | head -n 1)
          if [ -z "$ARCHIVO" ]; then
            echo "ERROR: Falta package.json."
            exit 1
          fi

          CARPETA=$(dirname "$ARCHIVO")
          echo "PROYECTO=$CARPETA" >> "$GITHUB_ENV"

          test -f "$CARPETA/capacitor.config.json"
          test -f "$CARPETA/www/index.html"
          test -f "$CARPETA/assets/icon.png"

      - name: Instalar dependencias
        run: npm install
        working-directory: ${{ env.PROYECTO }}

      - name: Crear proyecto Android
        run: npx cap add android
        working-directory: ${{ env.PROYECTO }}

      - name: Sincronizar aplicación
        run: npx cap sync android
        working-directory: ${{ env.PROYECTO }}

      - name: Crear iconos Android personalizados
        working-directory: ${{ env.PROYECTO }}
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          res = Path("android/app/src/main/res")
          origen = Path("assets/icon.png")

          if not origen.exists():
              raise SystemExit("ERROR: Falta assets/icon.png")

          imagen = Image.open(origen).convert("RGBA")

          # Iconos clásicos para distintas densidades.
          for densidad, tamano in [
              ("mdpi", 48),
              ("hdpi", 72),
              ("xhdpi", 96),
              ("xxhdpi", 144),
              ("xxxhdpi", 192)
          ]:
              carpeta = res / f"mipmap-{densidad}"
              carpeta.mkdir(parents=True, exist_ok=True)
              icono = imagen.resize(
                  (tamano, tamano), Image.Resampling.LANCZOS
              )
              icono.save(carpeta / "ic_launcher.png")
              icono.save(carpeta / "ic_launcher_round.png")

          # Imagen frontal para el icono adaptativo de Android.
          lienzo = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          frontal = imagen.resize(
              (360, 360), Image.Resampling.LANCZOS
          )
          lienzo.alpha_composite(frontal, (36, 36))

          carpeta_dibujos = res / "drawable"
          carpeta_dibujos.mkdir(parents=True, exist_ok=True)
          lienzo.save(carpeta_dibujos / "ic_launcher_foreground.png")

          # Fondo rojo del icono adaptativo.
          valores = res / "values"
          valores.mkdir(parents=True, exist_ok=True)
          archivo_colores = valores / "colors.xml"

          if archivo_colores.exists():
              arbol = ET.parse(archivo_colores)
              raiz = arbol.getroot()
          else:
              raiz = ET.Element("resources")
              arbol = ET.ElementTree(raiz)

          color = raiz.find("./color[@name='ic_launcher_background']")
          if color is None:
              color = ET.SubElement(
                  raiz, "color", {"name": "ic_launcher_background"}
              )
          color.text = "#B90018"
          arbol.write(
              archivo_colores, encoding="utf-8", xml_declaration=True
          )

          # Android 8 y posteriores usan estos archivos XML.
          adaptativos = res / "mipmap-anydpi-v26"
          adaptativos.mkdir(parents=True, exist_ok=True)

          contenido = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """

          for nombre in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              (adaptativos / nombre).write_text(
                  contenido, encoding="utf-8"
              )

          print("Iconos clásicos y adaptativos creados correctamente.")
          PY

      - name: Comprobar iconos creados
        working-directory: ${{ env.PROYECTO }}
        run: |
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          echo "Comprobación de iconos completada."

      - name: Construir APK
        working-directory: ${{ env.PROYECTO }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bolita-APK-icono-corregido
          path: ${{ env.PROYECTO }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
