
name: Crear APK de Bolita

on:
  workflow_dispatch:
  push:
    branches: [principal, main, master]

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK de Bolita
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar ZIP actualizado
        run: |
          ZIP=$(find . -maxdepth 5 -type f -iname 'Bolita-Proyecto-Completo-regla-80-sin-corrido.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP actualizado."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Localizar proyecto
        run: |
          ARCHIVO=$(find proyecto -type f -name package.json | head -n 1)

          if [ -z "$ARCHIVO" ]; then
            echo "ERROR: El ZIP no contiene package.json."
            find proyecto -maxdepth 5 -type f
            exit 1
          fi

          CARPETA=$(dirname "$ARCHIVO")
          echo "PROYECTO=$CARPETA" >> "$GITHUB_ENV"

          test -f "$CARPETA/capacitor.config.json"
          test -f "$CARPETA/www/index.html"

      - name: Instalar dependencias
        working-directory: ${{ env.PROYECTO }}
        run: npm install

      - name: Preparar Android
        working-directory: ${{ env.PROYECTO }}
        run: npx cap add android

      - name: Sincronizar aplicación
        working-directory: ${{ env.PROYECTO }}
        run: npx cap sync android

      - name: Construir APK
        working-directory: ${{ env.PROYECTO }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Bolita-APK-regla-80-sin-corrido
          path: ${{ env.PROYECTO }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
