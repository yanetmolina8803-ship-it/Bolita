
name: Crear APK de Bolita

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  construir:
    name: Construir aplicación Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descomprimir el proyecto
        run: |
          mkdir proyecto
          unzip -o Bolita-Proyecto-Completo.zip -d proyecto
          test -f proyecto/package.json

      - name: Instalar dependencias
        working-directory: proyecto
        run: npm install

      - name: Preparar Android
        working-directory: proyecto
        run: npx cap add android

      - name: Sincronizar aplicación
        working-directory: proyecto
        run: npx cap sync android

      - name: Construir APK
        working-directory: proyecto/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bolita-APK
          path: proyecto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
